# ============================================================
# LiteState - configuracion de nginx (reverse proxy)
#
# Este archivo se monta en /etc/nginx/conf.d/default.conf
# dentro del contenedor. La imagen oficial de nginx tiene un
# `include /etc/nginx/conf.d/*.conf` en su nginx.conf, asi que
# reemplazar default.conf es toda la integracion que hace falta.
#
# Que resuelve este archivo, en una frase:
#   "soy la unica puerta de entrada, y le paso a la app .NET
#    la peticion original mas los headers que Kestrel necesita
#    para saber de donde vino realmente".
# ============================================================

# ------------------------------------------------------------
# DNS de Docker
# ------------------------------------------------------------
# 127.0.0.11 es el resolver embebido de Docker: toda la red de
# contenedores es un DNS. Por eso `app` (nombre del servicio)
# se puede usar como hostname.
#
# Por que NO usamos un bloque `upstream { server app:8080; }`:
#
#   Nginx resuelve los nombres UNA SOLA VEZ, al arrancar.
#   Si despues se recrea el contenedor `app` (casi siempre pasa:
#   `docker compose up -d --build` levanta un contenedor nuevo),
#   ese contenedor recibe otra IP interna, y nginx sigue hablando
#   con la IP vieja que ya no existe. Resultado: 502 Bad Gateway
#   permanente hasta que se reinicie nginx a mano.
#
#   Con `resolver` + una variable en `proxy_pass`, la resolucion
#   se hace en CADA request, asi que nginx siempre encuentra al
#   contenedor vivo. `valid=10s` es el cacheo del DNS.
#   `ipv6=off` evita que busque tambien en AAAA, que Docker no usa.
# ------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

# ------------------------------------------------------------
# Compresion
# ------------------------------------------------------------
# Una de las cosas que hace el proxy por vos. Los dashboards de
# LiteState se piden cada 5 segundos (D-009): comprimir el HTML y
# el CSS importa mas de lo que parece.
# ------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_min_length   1024;
gzip_types        text/plain text/css text/javascript
                  application/javascript application/json
                  application/xml image/svg+xml;

server {
    # `default_server` + `server_name _` = "atendeme cualquier
    # nombre me manden". En el laboratorio se entra por localhost;
    # en el VPS (Fase 14) se reemplaza por el dominio real.
    listen      80 default_server;
    server_name _;

    # ------------------------------------------------------------
    # Health del PROPIO nginx
    # ------------------------------------------------------------
    # Endpoint propio que NO pasa por el proxy. Sirve para dos cosas:
    #   1. el healthcheck del contenedor (distinto del de la app);
    #   2. distinguir "se cayo nginx" de "se cayo la app".
    # `=` significa coincidencia EXACTA de ruta.
    # ------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    # ------------------------------------------------------------
    # Limite de subida
    # ------------------------------------------------------------
    # Por defecto nginx rechaza cuerpos de request > 1MB con 413.
    # No se usan subidas hoy, pero las laptops de planta sacan
    # fotos y este limite evita que un archivo rompa la peticion.
    # ------------------------------------------------------------
    client_max_body_size 20M;

    # ------------------------------------------------------------
    # Todo lo demas va a la app .NET
    # ------------------------------------------------------------
    location / {
        # Variable con la URL destino. Al usar una variable, nginx no
        # puede resolver el nombre en el arranque, y por eso necesita
        # el `resolver` de mas arriba: la resolucion se repite en cada
        # request y siempre da con el contenedor que esta vivo.
        set $app_upstream http://app:8080;

        # OJO: sin ruta despues de la URL. Si se escribiera
        # `proxy_pass http://app:8080/;` (con barra final), nginx
        # REEMPLAZARIA la URI original en vez de reenviarla, y las
        # rutas con sus segmentos (ej. /Operacion/CambiarSector)
        # empezarian a dar 404.
        proxy_pass $app_upstream;

        # HTTP/1.1 es obligatorio para que los headers `Connection`
        # y `Upgrade` (WebSockets) sean validos. Sin esto, nginx
        # degrada a HTTP/1.0.
        proxy_http_version 1.1;

        # --------------------------------------------------------
        # Headers: el corazon de un reverse proxy
        # --------------------------------------------------------
        # Kestrel UNICAMENTE ve la conexion de nginx. Sin esto, la app
        # cree que el visitante es el propio nginx.

        # Host real solicitado (incluye el puerto si lo hubo).
        proxy_set_header Host              $host;

        # IP real del cliente, para los logs de la app.
        proxy_set_header X-Real-IP         $remote_addr;

        # IP real del cliente + la cadena de proxies anteriores.
        # $proxy_add_x_forwarded_for AGREGA la IP a la lista existente
        # en vez de pisarla: en la Fase 14 (HTTPS) habra nginx -> y
        # quedara trazada toda la cadena.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # http o https SEGUN LO QUE VIO EL CLIENTE, no segun el enlace
        # nginx->app. Critico: con esto la app genera bien las cookies
        # Secure y las redirecciones en la Fase 14.
        proxy_set_header X-Forwarded-Proto $scheme;

        # --------------------------------------------------------
        # Timeouts
        # --------------------------------------------------------
        # El polling de LiteState es de 5s (D-009), muy holgado para el
        # default de 60s. Se dejan explicitos para que un cambio
        # futuro no los herede por sorpresa.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
